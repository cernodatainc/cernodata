        <div class="header-links">
            <a href="/planner" class="header-link-btn active">Planner Wizard</a>
        </div>
    </header>

    <div class="main-container">
        <!-- Form Section -->
        <div>
            <div class="status-banner" id="statusBanner"></div>

            <!-- 0. Browse Previous Results & Completed Outputs -->
            <div class="form-section">
                <div class="section-header">
                    <div class="section-num">0</div>
                    <div class="section-title">Previous results</div>
                    <div class="help-btn" tabindex="0"
                        title="Select an existing run to inspect or reuse its parameters">
                        <span class="help-icon">?</span>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="prevRunSelect">Completed run output</label>
                    <div class="prev-run-row">
                        <select id="prevRunSelect" class="override-select prev-run-select"
                            onchange="onPreviousRunSelected(this.value)">
                            <option value="">Choose a previous run</option>
                        </select>
                        <button type="button" class="btn btn-secondary btn-load-params"
                            onclick="loadSelectedPreviousRunIntoWizard()">
                            Load parameters
                        </button>
                        <a id="btnInspectViewer" href="/viewer.html" target="_blank"
                            class="btn btn-secondary btn-view-params">
                            Open in viewer
                        </a>
                    </div>
                    <div id="prevRunSummary" class="prev-run-summary">
                    </div>
                </div>
            </div>

            <!-- 1. Document & Ingestion Parameters -->
            <div class="form-section">
                <div class="section-header">
                    <div class="section-num">1</div>
                    <div class="section-title">Quality targets</div>
                    <div class="help-btn" tabindex="0" title="File source, language hint and confidence goal">
                        <span class="help-icon">?</span>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="docPath">Document file path</label>
                    <input type="text" id="docPath" class="input-text" placeholder="e.g. src/e2e/Dokument 5.pdf" />
                </div>

                <div class="inline-inputs">
                    <div class="input-group">
                        <div class="lang-hint-header">
                            <label class="input-label lang-hint-title" for="langCode">Language hint</label>
                            <label class="lang-hint-checkbox-label">
                                <input type="checkbox" id="enableLangHint" class="lang-hint-checkbox"
                                    onchange="toggleLanguageHint()" />
                                Provide hint
                            </label>
                        </div>
                        <select id="langCode" class="override-select lang-select-disabled" onchange="recalculate()"
                            disabled>
                            <option value="en">English (en)</option>
                            <option value="pl">Polish (pl)</option>
                            <option value="de">German (de)</option>
                            <option value="fr">French (fr)</option>
                            <option value="es">Spanish (es)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="thresholdSlider">Target confidence threshold</label>
                        <div class="slider-wrapper">
                            <input type="range" id="thresholdSlider" min="0.50" max="0.99" step="0.01" value="0.82"
                                oninput="updateThreshold(this.value)" />
                            <span class="slider-value" id="thresholdDisplay">0.82</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. Document Taxonomy -->
            <div class="form-section">
                <div class="section-header">
                    <div class="section-num">2</div>
                    <div class="section-title">Document taxonomy</div>
                    <div class="help-btn" tabindex="0" title="Primary structural layout shape">
                        <span class="help-icon">?</span>
                    </div>
                </div>
                <div class="options-grid" id="taxonomyGrid">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- 3. Quality vs Speed Target -->
            <div class="form-section">
                <div class="section-header">
                    <div class="section-num">3</div>
                    <div class="section-title">Processing priority</div>
                    <div class="help-btn" tabindex="0" title="Throughput priority versus layout fidelity">
                        <span class="help-icon">?</span>
                    </div>
                </div>
                <div class="options-grid" id="targetGrid">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- 4. Security Constraints -->
            <div class="form-section">
                <div class="section-header">
                    <div class="section-num">4</div>
                    <div class="section-title">Security</div>
                    <div class="help-btn" tabindex="0" title="Cloud API allowance vs. air-gapped local model">
                        <span class="help-icon">?</span>
                    </div>
                </div>
                <div class="options-grid" id="securityGrid">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- Sidebar / Ranking Preview -->
        <div class="sidebar">
            <div class="ranking-card">
                <div class="ranking-header">Suitability ranking</div>
                <div class="ranking-sub">Confidence scores update as you answer</div>

                <div id="presetsList">
                    <!-- Populated by JS -->
                </div>

                <div class="override-box">
                    <label class="override-title" for="overrideSelect">Primary preset override</label>
                    <select id="overrideSelect" class="override-select" onchange="onOverrideChanged()">
                        <option value="auto">Auto (recommended ranking)</option>
                        <option value="pypdfium_rapidocr">pypdfium_rapidocr</option>
                        <option value="docling_fast">docling_fast</option>
                        <option value="docling_deep">docling_deep</option>
                        <option value="vision_llm_direct">vision_llm_direct</option>
                    </select>
                </div>

                <button class="submit-btn" id="submitBtn" onclick="submitPlan()"
                    data-submit-endpoint="/api/submit_plan">
                    Start pipeline
                </button>
            </div>
        </div>
    </div>

    <script src="/data_shape_config.js" data-submit-endpoint="/api/submit_plan"></script>
</body>

</html>
