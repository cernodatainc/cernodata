<div class="inspector-pane">
    <div class="tab-bar">
        <button class="tab-btn active" id="tabBtnDom" data-name="dom page" onclick="showTab(event, 'domTab')"
            title="Click: Show selected page | Shift+Click: Show all pages"><span id="domTabLabel">DOM Page</span>
            (<span id="domCount">{{ dom_node_count }}</span>)</button>
        <button class="tab-btn" id="tabBtnViol" data-name="violations" onclick="showTab(event, 'violTab')"
            title="Click: Show selected page | Shift+Click: Show all pages"><span id="violTabLabel">Violations</span>
            (<span id="violCount">{{ violations_count }}</span>)</button>
        <button class="tab-btn" id="tabBtnLog" onclick="showTab(event, 'logTab')">Decision log</button>
        <button class="tab-btn" id="tabBtnPlan" onclick="showTab(event, 'planTab')">Plan</button>
        <button class="tab-btn" id="tabBtnRuns" onclick="showTab(event, 'runsTab')">Runs grid</button>
        <!-- TODO(TASK-709): Add a "Live Output" preview tab (outputTab) rendering synchronous Markdown and RAG chunk preview with hover highlighting to bounding boxes. -->
    </div>

    <div class="tab-content active" id="domTab">
        <div id="selectedEditorContainer"></div>
        <div id="domListContainer"></div>
    </div>
    <div class="tab-content" id="violTab">
        <div id="violListContainer"></div>
    </div>
    <div class="tab-content" id="logTab">
        <div class="log-box">
            <pre id="logContent"></pre>
        </div>
    </div>
    <div class="tab-content" id="planTab">
        <div class="log-box log-box-plan">
            <pre id="planContent"></pre>
        </div>
    </div>
    <div class="tab-content" id="runsTab">
        <div id="viewerRunsGridContainer" class="viewer-runs-grid-box"></div>
    </div>
</div>
